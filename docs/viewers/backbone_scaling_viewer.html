<style>
  :root{

  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0c1213; --surface:#131b1c; --sunk:#0a1011; --line:#243133; --line-soft:#1c2729;
      --ink:#e4eceb; --ink-2:#a2b4b1; --ink-3:#71857f;
      --accent:#4dbdb4; --accent-soft:#10312e;
      --good:#4ade80; --bad:#f87171; --warn:#d9a441; --warn-bg:#2d240f;
      --s1:#3b82f6; --s2:#0d9488; --s3:#ea580c; --s4:#c026d3;
      --grid:#1f2b2c;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0c1213; --surface:#131b1c; --sunk:#0a1011; --line:#243133; --line-soft:#1c2729;
    --ink:#e4eceb; --ink-2:#a2b4b1; --ink-3:#71857f;
    --accent:#4dbdb4; --accent-soft:#10312e;
    --good:#4ade80; --bad:#f87171; --warn:#d9a441; --warn-bg:#2d240f;
    --s1:#3b82f6; --s2:#0d9488; --s3:#ea580c; --s4:#c026d3;
    --grid:#1f2b2c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:0 22px}
  h1{font-size:clamp(1.9rem,4.5vw,2.6rem);line-height:1.05;margin:.2rem 0 0;

     text-wrap:balance}

           color:var(--ink-3);margin:0}
  p{margin:.75rem 0 0;text-wrap:pretty}
  .lede{font-size:1.03rem;color:var(--ink-2);max-width:70ch}
  b,strong{font-weight:640}
  code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:1px 5px;
       border-radius:3px;border:1px solid var(--line-soft)}

  header{padding:46px 0 34px;border-bottom:1px solid var(--line);background:var(--surface)}
  section{padding:40px 0;border-bottom:1px solid var(--line-soft)}
  section:last-of-type{border-bottom:0}

  .snum{font:640 .78rem/1 var(--mono);color:var(--accent);letter-spacing:.06em;

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;

  .tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;
        padding:14px 16px;box-shadow:var(--shadow)}
  .tile .k{font:600 .7rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.07em;
           color:var(--ink-3)}
  .tile .v{font-size:1.7rem;font-weight:660;letter-spacing:-.03em;margin-top:6px;
           font-variant-numeric:tabular-nums;line-height:1.05}

  figure{margin:24px 0 0;background:var(--surface);border:1px solid var(--line-soft);

  figcaption{font-size:.85rem;color:var(--ink-2);margin-top:12px;padding-top:11px;

  .chartbox{overflow-x:auto}
  svg{display:block;max-width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 10px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-2)}
  .sw{width:14px;height:3px;border-radius:2px;flex:none}

  table{border-collapse:collapse;width:100%;font-size:.87rem;margin-top:16px}
  th,td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line-soft);

  th:first-child,td:first-child{text-align:left}
  thead th{font:600 .69rem/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;

  .l{text-align:left!important}

        white-space:nowrap}

  .callout{margin-top:22px;padding:14px 17px;background:var(--warn-bg);
           border-left:3px solid var(--warn);border-radius:0 4px 4px 0}

           border:1px solid var(--line);border-radius:4px}

/* ============================================================================

const T = {
en:{
  eyebrow:"ORENA FRAME · status report · 16 August 2026",
  title:"27B vs 8B",
  lede:"Everything we have measured about whether a larger backbone wins, in one place: four models on the same 800 questions, the real leaderboard, the training recipes side by side, and the literature. The conclusion does not favour either camp cleanly.",
  tiles:[["our submission 03","0.5809","good","top 5 · official baseline cleared by +0.0620"],
         ["to the podium","+0.0026","","behind LLaVA-Med, a 7B model from 2023"],
         ["27B vs 8B, same corpus","−0.0588","bad","on the 800 shared questions"],
         ["cost of the 27B reasoning","19×","","9.888 s/question against 0.515 s"]],
  s1:{n:"01",h:"Model size does not order this leaderboard",
   p1:"The entire competitive field fits in a 0.10 band above the official baseline. Inside that band sit a freshly fine-tuned Qwen3.6 and <b>LLaVA-Med, a 7B medical model from 2023</b>, 0.04 apart. If backbone generation ordered this table, those two would not be neighbours.",
   cap:"Official <code>pre_evaluation_score</code> — the unweighted mean of the four populated buckets. The dashed line is the official fine-tuned baseline, which is the project's co-authorship condition.",
   call:"<b>What this costs the 27B argument.</b> The only external evidence for scaling the backbone was that rank 1 is named <i>Qwen3.6 Finetuned</i>. The same table now supplies the counterexample: a model one generation older and smaller sits on the podium. Whatever separates the top entries, it is not parameter count.",
   note:"<b>Submission 03 moved us +0.0521</b> (0.5288 → 0.5809) and turned a +0.0099 margin over the baseline — half a standard error, statistically indistinguishable from not clearing it — into <b>+0.0620</b>. The co-authorship condition is no longer at risk. The goal from here is rank, and the second evaluation stage."},
  s2:{n:"02",h:"Four models, the same 800 questions",
   p1:"HeiCo videos 0023 and 0027: held out of rung 42's training corpus, never in A2's, and inside the 27B's evaluation package. All three sources agree on all 800 gold answers, so the comparison is clean. <b>A2 and the 27B also share the same training corpus</b> (<code>train.jsonl</code> from rung 18) — that pair is the backbone A/B.",
   th:["model","params","corpus","accuracy","s/question"],
   rows:[["A2 ep3","8B","rung 18","0.5988","0.164",0],
         ["rung 42 ep4 — what we shipped","8B","rung 18 +4969","0.6075","0.253",1],
         ["gen-3.6 conn4e5, no thinking","27B","rung 18","0.5400","0.515",0],
         ["gen-3.6 conn4e5, thinking","27B","rung 18","0.3812","9.888",0]],
   cap:"Accuracy by answer format on the 800. The 27B wins <code>binary</code> and ties <code>multiple_choice</code>; its deficit is concentrated in <code>fo_class</code> (−0.128), which accounts for 76 % of the total gap.",
   tiles:[["both correct","383","rung 42 and the 27B"],["only rung 42","103","what the 8B knows and the 27B does not"],
          ["only the 27B","49","what it adds"],["both wrong","265","a third of the exam"]],
   p2:"The 27B is not a different model seeing different things — it is <b>mostly a subset</b>. It adds 49 wins and gives up 103. Rung 38 measured the same thing with a confidence interval: paired <code>ALL</code> <b>−0.0334 [−0.0642, −0.0027]</b>, excluding zero."},
  s3:{n:"03",h:"The training recipes, side by side",
   p1:"Pulled from the runs' own <code>args.json</code>, not from memory. Two things stand out, and both change how the numbers above should be read.",
   th:["hyperparameter","A2 (8B)","rung 42 (8B)","gen-3.6 conn4e5 (27B)"],
   rows:[["backbone","Qwen3-VL-8B","Qwen3-VL-8B","Qwen3.6-27B",1],
         ["lora_rank","8","8","8",0],
         ["lora_alpha","32","32","32",0],
         ["lora_dropout","0.1","0.1","<b>0.0</b>",1],
         ["target_modules","all-linear","all-linear + merger","all-linear",0],
         ["connector / merger","frozen","unfrozen + LoRA on the merger","<b>merger fully trained</b>, own LR 4e-5",1],
         ["freeze_vit","false","false","false",0],
         ["learning_rate","2e-4","2e-4","2e-4",0],
         ["lr_scheduler","cosine · warmup 0.03","cosine · warmup 0.03","cosine · warmup 0.03",0],
         ["weight_decay","0.1","0.1","not archived",1],
         ["max_grad_norm","1.0","1.0","not archived",1],
         ["optim","adamw_torch_fused","adamw_torch_fused","not archived",1],
         ["effective batch","16 (1×16)","16 (1×16)","16 (1×16)",0],
         ["max_pixels","none (native)","none (native)","921600 = 1280×720",0],
         ["epochs · steps","3 · 2703","5, ep4 shipped · 4848","1 + continuation · ~2703",1],
         ["corpus rows","14 415","19 384","14 415",1],
         ["seed","42","42","42",0]],
   call1:"<b>1. rung 42 is not “A2 plus data”.</b> It moves four things at once: the merged corpus, LoRA extended onto the <b>merger</b> layers, the <b>aligner unfrozen</b>, and five epochs instead of three. On the leaderboard that bundle was worth <b>+0.0521</b>. On our 800 HeiCo questions it shows as only +0.0087 — so the local HeiCo slice badly under-represents where rung 42 actually gained.",
   call2:"<b>2. The 27B has never run a recipe of its own.</b> Every difference from A2 is in the same direction — <b>less regularisation on the model that was already over-fitting</b> (training loss 0.068 against the 8B's 0.28–0.29, versus a documented 0.2 threshold). And three fields were never archived, which rung 40's own PLAN flags as unresolvable after the fact. So “the 27B loses” is measured; “the 27B backbone loses” is not — the recipe was ported from an 8B sweep and never re-tuned.",
   h2:"The fine-tuning setup — and the confound nobody can remove after the fact",
   p2:"The recipes above run on <b>different machinery</b>. This is not a detail: rung 38's own README states it as a limit on what its result can be used for.",
   sth:["setup","8B ladder (A2, rung 42)","27B (rung 38 → 40 conn4e5)"],
   srows:[["training framework","<b>ms-swift</b>","<b>Unsloth</b>",1],
          ["data format","ShareGPT-style <code>train.jsonl</code>","same rows, converted by <code>_tools/unsloth_data.py</code>",1],
          ["hardware","RunPod A100 80 GB","RunPod A100 80 GB",0],
          ["training precision","bf16 LoRA (no NF4)","bf16 LoRA (no NF4)",0],
          ["throughput","≈13.1 s/it","12.8 s/it",0],
          ["one epoch","901 steps (A2) · 1212 (rung 42)","901 steps · 3.17 h",0],
          ["merge path","<code>swift export --merge_lora</code>","<code>save_pretrained_merged</code> (Unsloth)",1],
          ["merge fidelity","clean","<b>PARTIAL CARRY</b> — connector weights carried (|Δ| 18 643), the two merger <b>biases dropped</b> (|Δ| 2.33) = <b>0.012 %</b> of the trained delta",1],
          ["processor artefact","<code>preprocessor_config.json</code>","writes <code>processor_config.json</code> instead",1],
          ["serving precision","bf16","FP8 w8a8, 33.46 GiB, <code>enforce_eager=true</code>",1],
          ["serving engine","vLLM 0.27.1","vLLM 0.27.1, <code>max_model_len</code> 2048 · util 0.82",0],
          ["replication","—","<b>none — no seed has ever been repeated</b>",1]],
   call3:"<b>The comparison confounds three things at once.</b> Backbone × training framework × regularisation. Rung 38's README says the middle one plainly: <i>“Unsloth arms carry a framework confound against the ms-swift ladder — fine for a candidate search, <b>invalid for attribution</b>.”</i> Everything in section 02 is a faithful measurement of <i>this pipeline</i>; none of it isolates the backbone.",
   call4:"<b>The merge defect, measured on the real model and sized.</b> Rung 40's G3 gate found Unsloth's merge silently dropping trained bias tensors, but it ran on a 2B proxy and the repeat on the 27B never happened — the guard crashed on a path-resolution bug before comparing anything. Repeated here directly against the base snapshot: the connector <b>weights carried</b> (|Δ| 8321.64 and 10321.09), and both merger <b>biases read exactly 0.0000</b> against base — dropped, confirming the gate on the real model. But the trained bias delta was <b>2.33 against 18 643 in the weights: 0.012 %</b>. So the evaluated checkpoint <b>is</b> the fine-tuned model — the full LoRA (604 modules, 107 M trainable) and the trained connector are all present. Worth fixing before the next 27B run; not an explanation for anything in section 02."},
  s4:{n:"04",h:"The counting wall, which no model size crosses",
   p1:"<code>number</code> is <b>71 % of everything rung 42 gets wrong</b> — 313 of its 442 errors. The failure has the same shape in all three models, 8B or 27B, one corpus or another: accuracy collapses as objects multiply, and reaches zero.",
   cap:"Accuracy on <code>number</code>-format questions by how many objects were actually present. The curves overlap: from 6 objects up, rung 42 and the 27B score zero everywhere and A2 breaks zero once (2 of 18 at gold 8). The 27B's mean prediction saturates at 3–4 regardless of the true value.",
   p2:"It is not a formatting problem — <b>of 235 failures, zero were malformed</b>; every one was a clean, wrong digit. It undercounts 6.6× more often than it overcounts. This is the subitizing limit: it enumerates well up to ~3 and then emits a small number.",
   lit:"what the literature says",
   lits:["<b>UniBench</b> (NeurIPS 2024) identifies counting as a capability where <b>scale produces no improvement</b>.",
         "<b>Unveiling the Visual Counting Bottleneck in VLMs</b> (arXiv 2605.30170) localises the collapse in <i>symbolic mapping</i>, reports that <b>large models fail to ground their counting rule visually</b>, and that accuracy flatlines near chance for larger quantities — exactly the curve above. It adds that <b>scaling data is not sufficient either</b>.",
         "Counting comparisons between 7B and 32B models show no consistent advantage for the larger one."],
   litend:"Three measurements of ours and two independent papers say the same thing: <b>this wall does not fall to parameters.</b>"},
  s5:{n:"05",h:"The 27B's reasoning carries information nothing else does",
   p1:"As an answer, thinking is worse in every format, including where the trace closes cleanly (0.5009 against 0.6114 on those same 579 questions). The longer it reasons, the worse it scores.",
   cap:"Accuracy by trace length across the 3115 questions where the 27B emitted an answer. Monotonically down — though part of the effect is that hard questions produce long traces, not only the other way round.",
   p2:"But measuring the <b>answer</b> is not measuring the <b>reasoning</b>. Searching for the gold answer inside the text of the traces that failed:",
   tiles:[["fo_class failures","84.1%","good","trace names every correct class (n=574)"],
          ["number failures","82.9%","good","the correct number appears in the trace (n=527)"],
          ["chance control","27.5%","","a different random number appears as often"],
          ["rung 34, in the weights","0.5264","","linear probe on hidden states vs the head's 0.4680"]],
   p3:"<b>The 27B has the answer and loses it on the way out</b>, and that is now measured at two different layers of the stack: in the text of the reasoning (83 %, three times chance) and in the model's own hidden states (rung 34). One fault, seen from two places.",
   call:"<b>The literature backs this route.</b> <i>LiteMedCoT-VL</i> distills reasoning chains from a Qwen3-VL-235B into a 2B student and lifts it from <b>48.7 % to 64.9 %</b> on PMC-VQA. Reasoning distillation works in medical VQA — and the 83 % above says our traces carry the signal.<br><br>⚠️ Two warnings worth saying out loud: that paper's teacher is a 235B far stronger than its student, whereas <b>ours scores below the student</b>; and this campaign has twice found “the answer is in there” and twice failed to extract it (rung 33, reading P(value) before the argmax: +0.01; rung 35, ordinal NTL-WAS loss: NO-GO with collateral damage)."},
  s6:{n:"06",h:"The counting attack: everything already ruled out",
   p1:"Seven rungs and nine decision notes have gone at counting. The output side and the loss side are both measured dead. This table exists so nobody re-runs them.",
   th:["intervention","rung","verdict"],
   rows:[["post-hoc calibration of the emitted number","—","dead on 3 pre-registered rules; gold 2, 3 and 4 share one mode"],
         ["global shift on the emitted integer","—","0.4718 → 0.2197"],
         ["oracle value lookup table","—","ceiling +0.0148"],
         ["GRPO, 0/1 exact-match reward","30","NO-GO, aggregation_ID −0.0094"],
         ["read P(value) before the argmax","33","gate A fails; family worth ≈ +0.01"],
         ["ordinal loss (NTL-WAS)","35","NO-GO — aggregation_ID −0.0262, veto cell −0.0880"],
         ["synthetic counting SFT","15","null; settled as discarded"],
         ["change the output format (name vs count)","—","same multiplicity, p = 0.45"],
         ["SAM 2 temporal probe","29","closed unrun — its premise was a unit error"],
         ["more corpus + more epochs","42","+0.0087 on these 800 (but +0.0521 on the leaderboard)"]],
   p2:"Rung 35 is the painful one: it was the theoretically <i>right</i> intervention. Rung 34 proved the count is present in the hidden states and lost in the projection to tokens, and NTL-WAS attacked exactly that projection. It failed and did collateral damage."},
  s7:{n:"07",h:"What is still open, and what it costs",
   th:["bet","status","evidence","cost"],
   rows:[["19a — enumeration probe","live","the one counting family never refuted: point supervision. HeiSurF is pixel-annotated for clips, specimen bags and drains","1–2 GPU-h, no training"],
         ["reasoning distillation from the 27B","live","83 % of traces contain the gold · LiteMedCoT-VL 48.7 → 64.9","traces already on disk; one 8B training run"],
         ["a 27B with a recipe of its own","untested","every 27B run was an 8B optimum transplanted onto another framework, through a lossy merge, never replicated","a sweep, not a run: 3–4 × 3.2 GPU-h"],
         ["thinking at inference","dead","0.3812 and 19× the cost; worse even where the trace closes","—"],
         ["scaling the backbone for counting","dead","three models, one curve · UniBench · arXiv 2605.30170","—"]],
   h2:"19a in one paragraph",
   p1:"Our model miscounts surgical clips, which are tiny and metallic on red tissue. That can fail two ways, and they want opposite fixes: <b>it cannot see them</b> (perception — needs resolution, segmentation, a detector) or <b>it sees them but cannot keep a tally</b> (enumeration — needs counting data). 19a separates the two for 1–2 GPU-hours by changing the object: take a model we already have, train nothing, show it externally annotated frames where the true count is exact, and ask how many <b>surgical instruments</b> are visible — large, obvious objects. If it also fails there, the deficit is enumeration and external counting data is on target. If it counts instruments fine and only misses clips, the deficit is small-object perception, external data cannot fix it, and the perception branch is the right one. Either way we learn it for ~5 % of what guessing costs.",
   call:"<b>Operational facts worth keeping in view.</b> The latency budget is pooled — <code>120 s + B×5 s</code>, timed by the platform — and at rank 1 it uses 19 % of the allowance, so <b>latency bounds nobody's model size</b>. Container admission is free and does not spend a submission; it returns errors but no metrics. Our local eval transfers in <b>direction</b> (8 of 8 bucket comparisons) but not in magnitude, and it is <b>inverted on <code>object_recognition_OOD</code></b> — our best bucket locally, our worst on the judge."},
  foot:"Measured on 800 shared questions (HeiCo 0023 + 0027) and the 4000-question HeiCo package. Leaderboard scores as of 16 August 2026. A2 and rung 42 latencies are a real per-question stopwatch; the 27B figures are batch means. Hyperparameters read from each run's archived <code>args.json</code>.",
  boardRows:[["Qwen3.6 Finetuned",0.6235,0],["Galen 1xHigh",0.5908,0],["LLaVA-Med",0.5835,0],
             ["us — submission 03",0.5809,1],["us — submission 02",0.5288,0],
             ["official fine-tuned baseline",0.5189,2],["official proprietary baseline",0.3883,2]],
  arms:["A2 · 8B","rung 42 · 8B","27B no thinking","27B thinking"],
  fmtLabel:"answer format", countX:"objects actually present", traceX:"tokens generated in the trace",
  zeroBand:"zero correct — except A2 at gold 8, which gets 2 of 18",
  noThink:"no thinking: .6485",
  flashTo:"Español"
},
es:{
  eyebrow:"ORENA FRAME · informe de estado · 16 de agosto de 2026",
  title:"27B contra 8B",
  lede:"Todo lo que hemos medido sobre si un backbone más grande gana, en un sitio: cuatro modelos sobre las mismas 800 preguntas, la tabla real, las recetas de entrenamiento enfrentadas y la literatura. La conclusión no le da la razón limpia a ninguno de los dos bandos.",
  tiles:[["nuestra submission 03","0.5809","good","top 5 · baseline oficial superada por +0.0620"],
         ["al podio","+0.0026","","por detrás de LLaVA-Med, un 7B de 2023"],
         ["27B contra 8B, mismo corpus","−0.0588","bad","sobre las 800 preguntas comunes"],
         ["coste del 27B razonando","19×","","9.888 s/pregunta contra 0.515 s"]],
  s1:{n:"01",h:"El tamaño no ordena esta tabla",

/* ---------- tiny SVG helpers ---------- */
const NS='http://www.w3.org/2000/svg';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S=()=>['--s1','--s2','--s3','--s4'].map(cssv);
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const tx=(x,y,s,o={})=>{const t=el('text',{x,y,...o});t.textContent=s;return t;};
const f3=v=>v.toFixed(3).replace('0.','.');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function tip(svg){
  const g=el('g',{opacity:0,'pointer-events':'none'});
  const r=el('rect',{rx:3,fill:cssv('--ink'),opacity:.95});
  const t=el('text',{fill:cssv('--surface'),'font-size':12,'font-family':'var(--mono)'});
  g.append(r,t);svg.append(g);
  return (x,y,s)=>{
    if(s===null){g.setAttribute('opacity',0);return;}
    t.textContent=s;g.setAttribute('opacity',1);
    const w=t.getComputedTextLength()+16;
    const px=Math.max(2,Math.min(x-w/2,svg.viewBox.baseVal.width-w-2));
    r.setAttribute('x',px);r.setAttribute('y',y-26);
    r.setAttribute('width',w);r.setAttribute('height',22);
    t.setAttribute('x',px+8);t.setAttribute('y',y-10);
  };
}
const hov=(node,show,x,y,s)=>{
  node.addEventListener('pointerenter',()=>show(x,y,s));
  node.addEventListener('pointerleave',()=>show(0,0,null));
};

function chartBoard(L){
  const rows=[...L.boardRows].sort((a,b)=>b[1]-a[1]);
  const W=920,RH=34,P={l:236,r:60,t:8,b:26},H=P.t+rows.length*RH+P.b,max=.68;
  const x=v=>P.l+(v/max)*(W-P.l-P.r);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,role:'img','aria-label':'Leaderboard scores'});
  const show=tip(svg);
  for(let v=0;v<=.6;v+=.2){
    svg.append(el('line',{x1:x(v),x2:x(v),y1:P.t,y2:H-P.b,stroke:cssv('--grid'),'stroke-width':1}));
    svg.append(tx(x(v),H-8,v.toFixed(1),{fill:cssv('--ink-3'),'font-size':11,'text-anchor':'middle','font-family':'var(--mono)'}));
  }
  rows.forEach((r,i)=>{
    const y=P.t+i*RH,col=r[2]===1?cssv('--accent'):r[2]===2?cssv('--ink-3'):S()[0];
    const b=el('rect',{x:P.l,y:y+7,width:Math.max(2,x(r[1])-P.l),height:16,rx:4,fill:col,opacity:r[2]===2?.45:1});
    hov(b,show,x(r[1]),y+8,`${r[0]} · ${r[1].toFixed(4)}`);svg.append(b);
    svg.append(tx(P.l-10,y+20,r[0],{fill:r[2]===1?cssv('--ink'):cssv('--ink-2'),'font-size':12.5,'text-anchor':'end','font-weight':r[2]===1?640:400}));
    svg.append(tx(x(r[1])+8,y+20,r[1].toFixed(4),{fill:cssv('--ink-2'),'font-size':12,'font-family':'var(--mono)'}));
  });
  const bx=x(.5189);
  svg.append(el('line',{x1:bx,x2:bx,y1:P.t,y2:H-P.b,stroke:cssv('--warn'),'stroke-width':2,'stroke-dasharray':'4 3'}));
  return svg;
}

function chartFmt(L){
  const W=920,H=314,P={l:42,r:12,t:12,b:70};
  const gw=(W-P.l-P.r)/FMT.length,bw=(gw-26)/4;
  const y=v=>P.t+(1-v)*(H-P.t-P.b);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,role:'img','aria-label':'Accuracy by answer format'});
  const show=tip(svg);
  for(let v=0;v<=1;v+=.25){
    svg.append(el('line',{x1:P.l,x2:W-P.r,y1:y(v),y2:y(v),stroke:cssv('--grid'),'stroke-width':1}));
    svg.append(tx(P.l-8,y(v)+4,v.toFixed(2).replace('0.','.'),{fill:cssv('--ink-3'),'font-size':11,'text-anchor':'end','font-family':'var(--mono)'}));
  }
  FMT.forEach((d,gi)=>{
    const gx=P.l+gi*gw+13;
    d[2].forEach((v,i)=>{
      const bx=gx+i*bw;
      const b=el('rect',{x:bx+1,y:y(v),width:bw-2,height:Math.max(2,y(0)-y(v)),rx:3,fill:S()[i]});
      hov(b,show,bx+bw/2,y(v),`${L.arms[i]} · ${f3(v)}`);svg.append(b);
    });
    svg.append(tx(gx+bw*2,H-50,d[0],{fill:cssv('--ink-2'),'font-size':12,'text-anchor':'middle'}));
    svg.append(tx(gx+bw*2,H-34,`n=${d[1]}`,{fill:cssv('--ink-3'),'font-size':11,'text-anchor':'middle','font-family':'var(--mono)'}));
  });
  svg.append(tx((P.l+W-P.r)/2,H-8,L.fmtLabel,{fill:cssv('--ink-3'),'font-size':11.5,'text-anchor':'middle'}));
  return svg;
}

function chartCount(L){
  const [golds,series]=COUNT;
  const W=920,H=320,P={l:44,r:22,t:14,b:46};
  const x=i=>P.l+i*(W-P.l-P.r)/(golds.length-1),y=v=>P.t+(1-v)*(H-P.t-P.b);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,role:'img','aria-label':'Counting accuracy by true object count'});
  const show=tip(svg);
  for(let v=0;v<=1;v+=.25){
    svg.append(el('line',{x1:P.l,x2:W-P.r,y1:y(v),y2:y(v),stroke:cssv('--grid'),'stroke-width':1}));
    svg.append(tx(P.l-8,y(v)+4,v.toFixed(2).replace('0.','.'),{fill:cssv('--ink-3'),'font-size':11,'text-anchor':'end','font-family':'var(--mono)'}));
  }
  golds.forEach((g,i)=>svg.append(tx(x(i),H-24,g,{fill:cssv('--ink-3'),'font-size':11.5,'text-anchor':'middle','font-family':'var(--mono)'})));
  svg.append(tx((P.l+W-P.r)/2,H-6,L.countX,{fill:cssv('--ink-3'),'font-size':11.5,'text-anchor':'middle'}));
  svg.append(el('rect',{x:x(5),y:P.t,width:x(9)-x(5),height:y(0)-P.t,fill:cssv('--bad'),opacity:.05}));
  svg.append(tx((x(5)+x(9))/2,P.t+16,L.zeroBand,{fill:cssv('--bad'),'font-size':11.5,'text-anchor':'middle','font-weight':600}));
  series.forEach((vals,si)=>{
    svg.append(el('path',{d:vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' '),fill:'none',
      stroke:S()[si],'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    vals.forEach((v,i)=>{
      const c=el('circle',{cx:x(i),cy:y(v),r:4.5,fill:S()[si],stroke:cssv('--surface'),'stroke-width':2});
      hov(c,show,x(i),y(v),`${L.arms[si]} · gold ${golds[i]} · ${f3(v)}`);svg.append(c);
    });
    // No direct labels here: the three series converge on zero at the right edge and sit within
    // a few pixels of each other at the left, so any anchor collides. Legend + hover carry identity.
  });
  return svg;
}

function chartTrace(L){
  const W=920,H=280,P={l:44,r:16,t:26,b:48};
  const x=i=>P.l+i*(W-P.l-P.r)/(TRACE.length-1),y=v=>P.t+(1-v/.7)*(H-P.t-P.b);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,role:'img','aria-label':'Accuracy by reasoning trace length'});
  const show=tip(svg);
  for(let v=0;v<=.7;v+=.175){
    svg.append(el('line',{x1:P.l,x2:W-P.r,y1:y(v),y2:y(v),stroke:cssv('--grid'),'stroke-width':1}));
    svg.append(tx(P.l-8,y(v)+4,v.toFixed(2).replace('0.','.'),{fill:cssv('--ink-3'),'font-size':11,'text-anchor':'end','font-family':'var(--mono)'}));
  }
  svg.append(el('line',{x1:P.l,x2:W-P.r,y1:y(.6485),y2:y(.6485),stroke:cssv('--accent'),'stroke-width':2,'stroke-dasharray':'5 3'}));
  svg.append(tx(W-P.r,y(.6485)-8,L.noThink,{fill:cssv('--accent'),'font-size':11.5,'text-anchor':'end','font-weight':600}));
  svg.append(el('path',{d:TRACE.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p[2])}`).join(' '),fill:'none',stroke:S()[3],'stroke-width':2,'stroke-linejoin':'round'}));
  TRACE.forEach((p,i)=>{
    const c=el('circle',{cx:x(i),cy:y(p[2]),r:4.5,fill:S()[3],stroke:cssv('--surface'),'stroke-width':2});
    hov(c,show,x(i),y(p[2]),`${p[0]} · ${f3(p[2])} · n=${p[1]}`);svg.append(c);
    svg.append(tx(x(i),H-26,p[0],{fill:cssv('--ink-3'),'font-size':11,'text-anchor':'middle','font-family':'var(--mono)'}));
  });
  svg.append(tx((P.l+W-P.r)/2,H-8,L.traceX,{fill:cssv('--ink-3'),'font-size':11.5,'text-anchor':'middle'}));
  return svg;
}

/* ---------- page assembly ---------- */
const tiles=a=>`<div class="tiles">${a.map(t=>
  `<div class="tile ${t[2]||''}"><div class="k">${esc(t[0])}</div><div class="v">${esc(t[1])}</div>
   <div class="n">${t[3]??''}</div></div>`).join('')}</div>`;
const table=(th,rows,cls='')=>`<div class="tw"><table><thead><tr>${
  th.map((h,i)=>`<th${i?'':' class="l"'}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
  rows.map(r=>{const flag=r[r.length-1];const cells=typeof flag==='number'?r.slice(0,-1):r;
    const rc=typeof flag==='number'&&flag?(cls||'us'):'';
    return `<tr class="${rc}">${cells.map((c,i)=>`<td${i?'':' class="l"'}>${c}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>`;
const legend=(names,dot)=>`<div class="legend">${names.map((a,i)=>
  `<span class="lg"><span class="sw${dot?' dot':''}" style="background:${S()[i]}"></span>${esc(a)}</span>`).join('')}</div>`;

let LANG='en';
render(LANG);

/* ---- hidden command: type "esp" for Spanish, "eng" for English ---- */
let buf='';
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA')return;
  buf=(buf+e.key.toLowerCase()).slice(-3);
  const want=buf==='esp'?'es':buf==='eng'?'en':null;
  if(want&&want!==LANG){
    LANG=want;render(LANG);
    const f=document.getElementById('flash');
    f.textContent=T[LANG==='es'?'en':'es'].flashTo;
    f.style.opacity=1;setTimeout(()=>f.style.opacity=0,1400);
    buf='';
  }
});
</script>
